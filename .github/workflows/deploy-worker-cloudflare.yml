name: Deploy Worker de descarga (Cloudflare)

# El worker `obtener-agentes-app.sozu.com` es el destino del QR del login y el
# respaldo del aviso de actualización. Se despliega desde el repo y no pegándolo
# en el dashboard: así el archivo en git ES lo que está corriendo, y un cambio de
# package o de id de App Store queda en el historial.
#
# Solo corre cuando cambia el worker o su config — un deploy web no tiene por qué
# tocar el redirector.
on:
  push:
    branches: [main]
    paths:
      - 'tool/cloudflare-worker-obtener-agentes-app.js'
      - 'tool/cloudflare/wrangler.toml'
      - '.github/workflows/deploy-worker-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret requerido: CLOUDFLARE_API_TOKEN, creado en Cloudflare con la
      # plantilla "Edit Cloudflare Workers" y acotado a la zona sozu.com. El
      # account_id no va aquí: vive en wrangler.toml porque no es un secreto.
      - name: Desplegar worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config tool/cloudflare/wrangler.toml

      # La PRIMERA vez, el dominio personalizado se acaba de crear: el DNS tarda
      # en propagarse y el certificado en emitirse. Sin esta espera, el deploy
      # sale bien y la verificación falla igual, que es la peor combinación —
      # se lee como "el worker está roto" cuando solo faltaban segundos.
      - name: Esperar a que el dominio responda
        run: |
          URL='https://obtener-agentes-app.sozu.com'
          for i in $(seq 1 20); do
            # `|| CODIGO=000` con ASIGNACIÓN, no `|| echo 000`: curl YA imprime
            # 000 cuando falla, así que el echo concatenaba y salía "000000" —
            # distinto de "000", la comparación daba por bueno el fallo y esta
            # espera se saltaba sola. Fue exactamente el bug del primer deploy.
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL") || CODIGO=000
            case "$CODIGO" in
              000|'') ;;
              *) echo "Responde tras ${i} intento(s) (HTTP $CODIGO)."; exit 0 ;;
            esac
            echo "Intento $i: el dominio todavía no resuelve. Esperando 15 s…"
            sleep 15
          done
          echo "ERROR: el dominio no respondió en ~5 min."
          echo "Si el worker sí se desplegó, revisa que el token tenga permiso de"
          echo "DNS:Edit sobre la zona sozu.com — el dominio personalizado lo necesita."
          exit 1

      # Un redirector roto no lo reporta nadie: simplemente no instalan la app.
      # Se comprueban los tres caminos que el worker distingue por User-Agent.
      - name: Verificar los tres caminos
        run: |
          URL='https://obtener-agentes-app.sozu.com'
          UA_ANDROID='Mozilla/5.0 (Linux; Android 14) Mobile'
          UA_IPHONE='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0) Mobile'
          UA_PC='Mozilla/5.0 (Windows NT 10.0; Win64; x64)'

          # SIN `set -e` a propósito, y cada curl con `|| VAR=...`: el shell del
          # step ya corre con -e, así que un curl que falla (DNS, timeout) mataba
          # el step con "exit code 6" y sin una sola línea que dijera qué pasó.
          # Aquí un fallo de red se convierte en código 000 y en un mensaje.
          #
          # El `|| c=000` es una ASIGNACIÓN, no un `echo`: curl ya escribe 000
          # cuando falla, así que un `|| echo 000` concatena y produce "000000".
          # Ese fue el bug que se saltó la espera del primer deploy y dejó el
          # step muriendo con "exit code 6" sin explicar nada.
          #
          # El `?cb=` es un rompe-cachés: el worker ignora la query, pero sin él
          # una respuesta guardada en el edge puede ser la del worker ANTERIOR y
          # el check mide un despliegue que ya no existe.
          FALLOS=0
          codigo() {
            local c
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "User-Agent: $1" "$URL?cb=$CB") || c=000
            echo "${c:-000}"
          }
          destino() { curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 -H "User-Agent: $1" "$URL?cb=$CB" || true; }
          cuerpo() { curl -s --max-time 20 -H "User-Agent: $1" "$URL?cb=$CB" | head -c 2000 || true; }

          # La comprobación va en una función porque se REINTENTA: el paso anterior
          # espera a que el dominio responda, no a que responda el worker NUEVO, y
          # entre PoPs de Cloudflare eso no es instantáneo. Sin reintento, un deploy
          # correcto se reporta rojo por haber medido demasiado pronto.
          verificar() {
            FALLOS=0

            # Android: los mismos dos estados válidos que iOS, porque el listing de
            # Play tampoco es público todavía. Con ANDROID_DISPONIBLE en false,
            # página de "Próximamente" (200); en true, redirección a Play, y ahí el
            # package tiene que ser el de AGENTES: que apunte al de clientes es el
            # error más fácil de cometer y el más difícil de notar.
            #
            # Antes se exigía la redirección SIEMPRE, y por eso el deploy que
            # introdujo la bandera salió rojo mientras el worker hacía justo lo que
            # se le pidió. Redirigir a una ficha inexistente es precisamente el bug
            # que se está evitando: Play responde 404 y su app lo muestra como
            # "Elemento no encontrado", o sea un QR que parece muerto.
            CODIGO=$(codigo "$UA_ANDROID"); DESTINO=$(destino "$UA_ANDROID")
            CUERPO=$(cuerpo "$UA_ANDROID")
            echo "Android    -> $CODIGO ${DESTINO:-(html)}"
            case "$CODIGO" in
              000) echo "  ERROR: no se pudo alcanzar el dominio."; FALLOS=$((FALLOS+1)) ;;
              200) if echo "$CUERPO" | grep -qi 'Pr.ximamente'; then
                     echo "  OK: página de Próximamente (Android sin ficha todavía)."
                   else
                     echo "  ERROR: 200 sin la página de Próximamente."; FALLOS=$((FALLOS+1))
                   fi ;;
              30*) case "$DESTINO" in
                     *play.google.com*id=com.sozu.agentes_app*) echo "  OK: manda a la app de agentes en Play." ;;
                     *) echo "  ERROR: destino inesperado. ¿El package quedó el de clientes?"; FALLOS=$((FALLOS+1)) ;;
                   esac ;;
              *) echo "  ERROR: ni página ni redirección, llegó $CODIGO"; FALLOS=$((FALLOS+1)) ;;
            esac

            # iOS: mientras no haya ficha, página de "Próximamente" (200). Cuando se
            # publique, redirección a App Store. Cualquiera de las dos es válida; lo
            # que NO se acepta es mandar a una ficha que no existe.
            CODIGO=$(codigo "$UA_IPHONE"); DESTINO=$(destino "$UA_IPHONE")
            CUERPO=$(cuerpo "$UA_IPHONE")
            echo "iPhone     -> $CODIGO ${DESTINO:-(html)}"
            if [ "$CODIGO" = "200" ]; then
              if echo "$CUERPO" | grep -qi 'Pr.ximamente'; then
                echo "  OK: página de Próximamente (iOS sin ficha todavía)."
              else
                echo "  ERROR: 200 sin la página de Próximamente."; FALLOS=$((FALLOS+1))
              fi
            else
              case "$DESTINO" in
                *apps.apple.com*id[0-9]*) echo "  OK: manda a la ficha de App Store." ;;
                *) echo "  ERROR: iOS sin página ni ficha válida ($CODIGO $DESTINO)"; FALLOS=$((FALLOS+1)) ;;
              esac
            fi

            # Escritorio: la landing con los dos botones.
            CODIGO=$(codigo "$UA_PC")
            echo "Escritorio -> $CODIGO"
            if [ "$CODIGO" = "200" ]; then
              echo "  OK: landing de escritorio."
            else
              echo "  ERROR: la landing no responde 200."; FALLOS=$((FALLOS+1))
            fi

            # Se reportan los TRES y luego se decide: si solo el de iOS está mal,
            # hay que saber que Android y escritorio sí quedaron, no quedarse en el
            # primer error y volver a desplegar a ciegas.
            return "$FALLOS"
          }

          # 4 intentos separados 20 s: cubre la propagación sin esconder un fallo
          # real, que a los ~80 s sigue ahí. El `if` y no un `&&`: en el último
          # intento un `&&` con la condición falsa devuelve 1 y, con el shell en
          # -e, mata el step antes del mensaje final. Justo lo que este archivo
          # lleva dos arreglos evitando.
          for INTENTO in 1 2 3 4; do
            CB="$GITHUB_RUN_ID-$INTENTO"
            echo "--- intento $INTENTO ---"
            if verificar; then
              echo "OK: los tres caminos responden como deben."
              exit 0
            fi
            if [ "$INTENTO" -lt 4 ]; then
              echo "$FALLOS camino(s) mal; reintento en 20 s."
              sleep 20
            fi
          done
          echo "$FALLOS camino(s) mal tras 4 intentos."
          exit 1
